<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>망켓몬 제작기</title>
<meta name="description" content="망켓몬 트레이너·포켓몬 제작기 — 함께 보고 고치는 공용판">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2317202C'/%3E%3Cpath d='M2 16a14 14 0 0 1 28 0z' fill='%23C8362B'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fff' stroke='%2317202C' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/maker.css?v=202611020300">
<link rel="stylesheet" href="css/vtheme.css?v=202610252000"><!-- VELVET 테마 P5 · P3 · P4 (오레마스와 같은 결) -->
<script src="js/vtheme.js?v=202610251600"></script>
</head>
<body>
<div id="mk">
<header class="top">
  <div class="brand"><span class="ball" aria-hidden="true"></span><span class="bt">망켓몬 제작기</span></div>
  <nav class="tabs" id="tabs"><button data-tab="rule">룰북</button><button data-tab="char" class="on">캐릭터<span class="wide-only"> 제작</span></button><button data-tab="type">타입<span class="wide-only"> 배분</span></button><button data-tab="db">DB<span class="wide-only"> 관리</span></button><button data-tab="tbl"><span class="wide-only">테이블·</span>계산식</button><button data-tab="log">로그<span class="wide-only"> 정리기</span></button><button data-tab="notes">업뎃<span class="wide-only"> 노트</span></button></nav>
  <button class="btn sm toolsbtn" type="button" data-toolsbtn aria-expanded="false" aria-controls="tools">파일 <span aria-hidden="true">▾</span></button>
  <div class="tools" id="tools">
    <button class="btn sm" data-act="xlsxOut">엑셀로 내보내기</button>
    <label class="btn sm" for="xlsxIn" tabindex="0" role="button" data-kbd>엑셀 불러오기</label><input type="file" id="xlsxIn" accept=".xlsx,.xls,.csv" hidden>
    <button class="btn sm" id="mebtn" type="button" title="비공개 설정에 쓰는 내 서명">서명 없음</button>
    <button class="btn sm" data-act="bakOut">백업 저장</button>
    <label class="btn sm" for="bakIn" tabindex="0" role="button" data-kbd>백업 불러오기</label><input type="file" id="bakIn" accept=".json" hidden>
    <span id="saved" aria-live="polite"></span>
  </div>
</header>
<main>
  <section id="v-rule" hidden><iframe id="ruleFrame" title="트레이너 룰북" loading="lazy"></iframe></section>
  <section id="v-char"></section>
  <section id="v-type" hidden></section>
  <section id="v-db" hidden></section>
  <section id="v-tbl" hidden></section>
  <section id="v-log" hidden><div class="lgbar"><b>로그 정리기</b><span class="small muted">맵툴 · 오레마스 로그를 세션 로그로 정리 · 「제작기 그림 잇기」로 캐릭터 초상 연결</span><span class="sp"></span><a class="btn sm ghost" href="logtool/index.html" target="_blank" rel="noopener">새 창으로</a></div><iframe id="logFrame" title="로그 정리기" loading="lazy"></iframe></section>
  <section id="v-notes" hidden></section>
</main>
<div id="toast" role="status"></div>
  </div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/store.js?v=202610251130"></script>
<script src="data/db.js?v=202610261530"></script>
<script src="js/vendor/jszip.min.js"></script>
<script src="js/notes.js?v=202610291900"></script>
<script src="js/rulebook_host.js?v=202610220630"></script>
<script src="js/potlint.js?v=202610240800"></script>
<script src="js/maker.js?v=202611020400"></script>
</body>
</html>
