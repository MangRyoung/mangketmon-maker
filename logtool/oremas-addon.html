<!-- ===== 오레마스 연동 + 원본 보정 (덧붙임) =====
  바탕: src/original.html = claude.ai 「맵툴 로그 정리기 (슬라임)」 판 (폴더 · 끌어서 순서 바꾸기 · 스타일 · 줄 편집).
  원본은 그대로 두고, 합친 페이지에서 원본 함수를 덮어써 고친다.
  - 오레마스(https://mangryoung.github.io/oremas/) 방의 로그를 읽어 정리기 로그로 넣는다 (읽기 전용, Supabase 공개 키).
  - 주소에 ?oremas=방ID 를 붙여 열면 바로 불러온다 (오레마스의 「정리기에서 열기」). -->
<template id="omPanelTpl">
  <section class="panel" id="omPanel">
    <h2>오레마스 방 불러오기</h2>
    <div class="row"><input type="text" id="omRoom" placeholder="방 링크나 방 ID (예: …/oremas/#r=abcd1234)" style="flex:1;min-width:0" autocomplete="off"></div>
    <div class="toggles">
      <label><input type="checkbox" id="omDice" checked> 주사위</label>
      <label><input type="checkbox" id="omBattle" checked> 배틀 · 시스템</label>
      <label><input type="checkbox" id="omSms"> 휴대폰 문자</label>
      <label><input type="checkbox" id="omCut"> 비운 로그도</label>

    <div class="row"><button class="btn primary" type="button" id="omGo">불러오기</button><span class="hint" id="omMsg"></span></div>
    <p class="hint">대사 · 지문 · 주사위 · 배틀 카드(효과 본문 포함) · 올린 그림을 옮기고, 화자 초상을 방의 시트 그림으로 이어 줘요. 귓속말은 서버가 공개하지 않아 빠져요. 오레마스에서 내려받은 HTML · TXT 는 「로그 파일 추가」나 끌어 놓기로 넣으면 돼요.</p>
  </section>
</template>
<style>
.line img.mi{display:block;max-width:min(360px,100%);max-height:360px;border-radius:8px;margin:4px 0;border:1px solid var(--line)}
.line a.lk{color:var(--accent)}
</style>
<script>
(()=>{
 const OM={url:'https://jsnvqcvwspxzfnhdethl.supabase.co',key:'sb_publishable_HDcgWnb1QS1P6GOiBPqdAA_yBJNhU7R'};
 const SAFE_SRC=/^(https?:\/\/|data:image\/)/i;          /* 그림 주소는 http(s) · data:image 만 (javascript: 같은 주소는 버린다) */
 const DICE_TITLE=/\d*d\d+|[«»=]|rolled|굴림|판정/i;

 /* 내보낸 HTML 에도 그림 · 링크 모양이 들어가게 #logcss 에 덧붙인다 */
 $('logcss').textContent+='\n.line img.mi{display:block;max-width:min(360px,100%);max-height:360px;border-radius:8px;margin:4px 0;border:1px solid var(--line)}\n.line a.lk{color:var(--accent)}';

 /* ================= 저장소 부팅 기다리기 =================
    원본 부팅은 저장소를 읽고 renderCamps() → (예시 넣기) → 첫 화면 renderLog() 순서로 끝난다.
    ?oremas= 자동 불러오기는 그 뒤에 돌아야 부팅이 고른 로그로 덮이지 않는다 */
 let bootStage=0,bootRes;const boot=new Promise(r=>bootRes=r);
 const origRenderCamps=renderCamps;renderCamps=function(){if(!bootStage)bootStage=1;return origRenderCamps.apply(this,arguments)};
 const origRenderLog=renderLog;renderLog=function(){const r=origRenderLog.apply(this,arguments);if(bootStage===1){bootStage=2;setTimeout(bootRes,0)}return r};
 setTimeout(()=>{if(bootStage<2){bootStage=2;bootRes()}},15000);

 /* ================= 토큰: 그림 · 링크 =================
    원본 토큰은 글 · 줄바꿈 · 주사위뿐이라 본문 그림과 링크가 사라졌다. {t:'img',src} · {t:'link',href,v} 를 더한다 */
 const origTok=tokHTML;
 tokHTML=function(tk){return tk.map(t=>{
  if(t.t==='img')return SAFE_SRC.test(t.src||'')?`<img class="mi" src="${esc(t.src)}" alt="그림" loading="lazy">`:'';
  if(t.t==='link')return /^https?:/i.test(t.href||'')?`<a class="lk" href="${esc(t.href)}" target="_blank" rel="noopener">${esc(t.v||t.href)}</a>`:esc(t.v||'');
  return origTok([t])}).join('')};
 const plain2=tk=>tk.map(t=>t.t==='text'?t.v:t.t==='roll'?`[${t.expr?t.expr+' = ':''}${t.res}]`:t.t==='img'?'[그림]':t.t==='link'?(t.v||t.href):'\n').join('');

 /* ================= 본문 읽기 (walk) =================
    - 본문 속 그림(http(s) · data:image)은 그림 토큰으로 남긴다. 초상으로 쓴 그림(data-mtl-portrait)은 뺀다
    - http(s) 링크는 링크 토큰 (음원 · 유튜브 링크는 원본처럼 BGM 줄로 따로 뽑히므로 글자로만)
    - title 이 있는 span 은 주사위처럼 보일 때(1d20 · « » · = · Rolled …)만 주사위 칩. 그냥 툴팁은 글자로 둔다 */
 walk=function(node,fmt,out){
  for(const n of node.childNodes){
   if(n.nodeType===3){const v=n.nodeValue.replace(/\s+/g,' ');if(v)pushText(out,v,fmt);continue}
   if(n.nodeType!==1)continue;
   const tag=n.tagName.toLowerCase();
   if(tag==='br'){out.push({t:'br'});continue}
   if(tag==='img'){if(n.hasAttribute('data-mtl-portrait'))continue;const s=n.getAttribute('src')||'';if(SAFE_SRC.test(s))out.push({t:'img',src:s});continue}
   if(/^(script|style|audio|video|source|embed|object|iframe|button)$/.test(tag))continue;
   if(n.classList.contains('tools'))continue;
   if(tag==='a'){const h=n.getAttribute('href')||'',tx=n.textContent.trim();const im=n.querySelector('img:not([data-mtl-portrait])');
    if(!tx&&im){const s=im.getAttribute('src')||'';if(SAFE_SRC.test(s)){out.push({t:'img',src:s});continue}}
    if(/^data:image\//i.test(h)){out.push({t:'img',src:h});continue}
    if(/^https?:/i.test(h)&&!AUDIO_RE.test(h)&&!isYT(h)){out.push({t:'link',href:h,v:tx||h});continue}}
   if(n.classList.contains('roll')&&n.querySelector('.rs')){out.push({t:'roll',expr:(n.querySelector('.ex')?.textContent||'').replace(/\s*=\s*$/,'').trim(),res:n.querySelector('.rs').textContent.trim()});continue}
   if(tag==='span'&&n.textContent.trim()){const tt=(n.getAttribute('title')||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
    if(/roll/i.test(n.className)||(tt&&DICE_TITLE.test(tt))){out.push({t:'roll',expr:tt,res:n.textContent.trim().replace(/^«\s*|\s*»$/g,'')});continue}}
   const f={...fmt};
   if(tag==='b'||tag==='strong')f.b=1;
   if(tag==='i'||tag==='em')f.i=1;
   if(tag==='u')f.u=1;
   const block=/^(div|p|tr|li|table|h\d)$/.test(tag);
   if(block&&out.length&&out.at(-1).t!=='br')out.push({t:'br'});
   walk(n,f,out);
   if(block&&out.length&&out.at(-1).t!=='br')out.push({t:'br'});
  }
  return out;
 };

 /* ================= 화자 판별 =================
    「10:30」 같은 시각의 콜론은 이름 구분으로 읽지 않는다 (「Note at 10:30」 → 화자 「Note at 10」, 「오후 3:30 출발」 → 화자 「오후 3」 이 되던 문제) */
 takePrefix=function(tk){
  let ts=null;
  if(tk[0]&&tk[0].t==='text'){
   let v=tk[0].v;const tm=v.match(/^\s*\[?(\d{1,2}:\d{2}(?::\d{2})?)\]?\s*/);if(tm){ts=tm[1];v=v.slice(tm[0].length)}
   const vals=tk.map((t,j)=>j===0?{...t,v}:t);let acc='';
   for(let i=0;i<vals.length&&vals[i].t==='text';i++){
    acc+=vals[i].v;
    const nm=acc.match(/^([^:：«»\n]{1,40}?)\s*[:：]\s?/);
    if(nm&&!/https?$/i.test(nm[1])){
     if(/\d$/.test(nm[1])&&/^\d/.test(acc.slice(nm[0].replace(/\s+$/,'').length)))break;   // 숫자:숫자 = 시각
     return{ts,name:nm[1].trim(),tokens:trimTokens([{...vals[i],v:acc.slice(nm[0].length)},...vals.slice(i+1)])}}
    if(acc.length>60)break;
   }
   return{ts,name:null,tokens:trimTokens(vals)};
  }
  return{ts,name:null,tokens:trimTokens(tk)};
 };

 /* ================= 정리기가 내보낸 HTML 다시 읽기 =================
    전에는 <body> 아래가 여러 덩어리라 메시지 하나로 뭉쳤다. 내보낸 꼴(.entries > .grp · .gm · .sys · .bgm)을 그대로 되읽는다.
    예전 GitHub 판(#bgmbar)과 이 판(.log-head) 둘 다 */
 const isOwnExport=doc=>!!doc.querySelector('main .entries')&&(!!doc.querySelector('main .log-head')||!!doc.getElementById('bgmbar'));
 function dataToBlob(d){const[h,b]=d.split(',');const bin=atob(b);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:(h.match(/data:([^;]+)/)||[])[1]||'application/octet-stream'})}
 async function fromOwnExport(doc){
  const css=[...doc.querySelectorAll('style')].map(x=>x.textContent).join('\n');const pics={};
  css.replace(/\.([\w-]+)\{background-image:url\("([^"]+)"\)\}/g,(_,k,u)=>{pics[k]=u;return ''});
  const picOf=el=>{if(!el)return null;const t=el.matches('.tk')?el:el.querySelector('.tk');if(!t)return null;const k=[...t.classList].find(c=>pics[c]);if(!k)return null;const u=pics[k];if(!/^data:image\//.test(u))return null;const key='d'+hashStr(u);if(!S.imgs[key])S.imgs[key]=u;return key};
  const lineToks=el=>{const c=el.cloneNode(true);c.querySelectorAll('.ts,.n,.tools,.del').forEach(x=>x.remove());return trimTokens(walk(c.querySelector('.tx')||c,{},[]))};
  const whoOf=el=>{const w=el&&el.querySelector('.who');if(!w)return{name:'',tag:''};const c=w.cloneNode(true);const tag=(c.querySelector('.tag')||{}).textContent||'';c.querySelectorAll('.ts,.tag,.tk').forEach(x=>x.remove());return{name:c.textContent.trim(),tag:tag.trim()}};
  const tsOf=el=>((((el.querySelector('.ts')||{}).textContent||'').trim()).match(/^\d{1,2}:\d{2}(?::\d{2})?$/)||[null])[0];   /* 시각 칸은 HH:MM 꼴만 — 다른 글이 meta 줄에 HTML 로 들어가지 않게 */
  const out=[];
  const bgmOf=async b=>{const src=b.dataset.src||'',title=b.dataset.title||'BGM';const yt=b.querySelector('a[href]');
   if(/^data:audio\//i.test(src)){try{const aid=uid();const blob=dataToBlob(src);await idb.set('audio:'+aid,{name:title,blob});audioURL[aid]=URL.createObjectURL(blob);return{id:uid(),type:'bgm',title,audioId:aid}}catch(e){return null}}
   const url=src||(yt&&yt.getAttribute('href'))||'';return url?{id:uid(),type:'bgm',title,url}:null};
  for(const g of doc.querySelectorAll('.entries > *')){
   const ts=tsOf(g);
   if(g.classList.contains('part')||g.classList.contains('empty'))continue;
   if(g.classList.contains('bgm')){const m=await bgmOf(g);if(m)out.push(m);continue}
   if(g.classList.contains('sys')){for(const ln of g.querySelectorAll('.line')){for(const b of ln.querySelectorAll('.bgm[data-src]')){const m=await bgmOf(b);if(m)out.push(m);b.remove()}const tokens=lineToks(ln);if(tokens.length)out.push({id:uid(),ts,name:null,type:'sys',tokens})}continue}
   const emote=g.classList.contains('emote')?g.querySelector('.line'):g.querySelector('p.line.emote');
   if(emote){const n=(emote.querySelector('b.n')||{}).textContent||'';const tokens=lineToks(emote);const a=picOf(g.querySelector('.av'));if(tokens.length){const m={id:uid(),ts,name:n.trim()||null,type:'emote',tokens};if(a)m.asset=a;out.push(m)}continue}
   const{name,tag}=whoOf(g);const wh=/^귓속말/.test(tag),ooc=tag==='OOC';
   const to=wh?((tag.match(/→\s*(.+)$/)||[])[1]||'').trim():'';
   const a=picOf(g.querySelector('.av'))||picOf(g.querySelector('.who'));
   g.querySelectorAll('.line').forEach((ln,i)=>{const tokens=lineToks(ln);if(!tokens.length)return;const m={id:uid(),ts:i?null:ts,name:name||null,type:wh?'whisper':ooc?'ooc':'say',tokens};if(wh)m.to=to;if(a)m.asset=a;out.push(m.type==='say'&&!m.name?classify(m):m)});
  }
  const t=doc.querySelector('.log-title');
  return{msgs:out,title:t?t.textContent.trim():''};
 }

 /* ================= HTML 로그 읽기 =================
    - 표 형식: 이름 칸에서 화자를 찾았으면 본문 앞의 「…:」 를 자르지 않는다 (「규칙: 판정은…」 → 「판정은…」, 「오후 3:30에」 → 「30에」 로 잘리던 문제)
    - 초상: 표 형식은 본문 칸 밖의 첫 그림, 아니면 글자보다 앞에 나오는 첫 그림만. 나머지 그림은 본문에 남는다 */
 const leading=(el,im)=>{try{const r=el.ownerDocument.createRange();r.setStart(el,0);r.setEndBefore(im);return !r.toString().trim()}catch(e){return false}};
 parseHTML=function(raw){
  const doc=new DOMParser().parseFromString(raw,'text/html');
  doc.querySelectorAll('script,style,head,title').forEach(n=>n.remove());
  let blocks=[...doc.body.children];
  while(blocks.length===1&&blocks[0].tagName!=='TABLE'&&blocks[0].children.length>1)blocks=[...blocks[0].children];
  if(blocks.length<=1){const html=(blocks[0]||doc.body).innerHTML;blocks=html.split(/<br\s*\/?>/i).map(h=>{const d=doc.createElement('div');d.innerHTML=h;return d})}
  const out=[];
  for(const el of blocks){
   out.push(...findBgm(el));
   if(!el.textContent.trim()&&!el.querySelector('img'))continue;
   const tds=el.tagName==='TABLE'||el.querySelector('table')?[...el.querySelectorAll('td')]:[];
   const body=tds.length>=2?tds.at(-1):null;
   const ims=[...el.querySelectorAll('img')];
   const pic=body?ims.find(i=>!body.contains(i)):ims.find(i=>{const s=i.getAttribute('src')||'';return(/^asset:\/\//i.test(s)||/^data:image\//i.test(s))&&leading(el,i)});
   if(pic)pic.setAttribute('data-mtl-portrait','');
   let m;
   if(body){
    const nameCell=tds.slice(0,-1).reverse().find(td=>td.textContent.trim());
    let ts=null,name=nameCell?nameCell.textContent.trim().replace(/[:：]\s*$/,''):null;
    const tm=name&&name.match(/^\[?(\d{1,2}:\d{2}(?::\d{2})?)\]?\s*/);if(tm){ts=tm[1];name=name.slice(tm[0].length)}
    const toks=walk(body,{},[]);let inner=takePrefix(toks);
    if(name&&inner.name!==name){const t0=toks[0]&&toks[0].t==='text'?toks[0].v:'';const tm2=t0.match(/^\s*\[?(\d{1,2}:\d{2}(?::\d{2})?)\]\s*/);
     inner={ts:tm2?tm2[1]:null,name:null,tokens:trimTokens(tm2?[{...toks[0],v:t0.slice(tm2[0].length)},...toks.slice(1)]:toks)}}
    m={ts:ts||inner.ts,name:name||inner.name,tokens:inner.tokens};
   }else m=takePrefix(walk(el,{},[]));
   if(pic){const src=pic.getAttribute('src')||'';const a=src.match(/asset:\/\/([0-9a-f]{32})/i);
    if(a)m.asset=a[1].toLowerCase();
    else if(/^data:image\//.test(src)){const k='d'+hashStr(src);if(!S.imgs[k])S.imgs[k]=src;m.asset=k}}
   if(m.tokens.length){m.id=uid();out.push(classify(m))}
  }
  return out;
 };

 /* ================= 형식 판별 =================
    진짜 태그가 있을 때만 HTML 로 읽는다 (텍스트 로그에 「<b」 같은 글자가 한 번 있어도 HTML 로 가던 문제) */
 const looksHTML=r=>/^\s*<(!doctype|html|head|body|div|table|span|p|b|i|font|a|br|audio|iframe|img|main)\b/i.test(r)||/<\/(div|table|tr|td|span|p|b|i|u|font|a|li)\s*>/i.test(r)||/<br\s*\/?>/i.test(r)||/<(audio|iframe|img)\s[^>]*>/i.test(r);
 parseInput=function(raw){
  raw=raw.trim();if(!raw)return[];
  const msgs=looksHTML(raw)?parseHTML(raw):parseText(raw);
  const known=[...new Set(msgs.filter(m=>m.name).map(m=>m.name))].sort((a,b)=>b.length-a.length);
  for(const m of msgs){
   if(m.type==='emote'&&!m.name&&m.tokens[0]?.t==='text'){
    const v=m.tokens[0].v.replace(/^\*\s?/,'');const k=known.find(n=>v.startsWith(n));
    if(k){m.name=k;m.tokens[0]={...m.tokens[0],v:v.slice(k.length).replace(/^\s+/,'')}}else m.tokens[0]={...m.tokens[0],v};
   }
  }
  return msgs;
 };

 /* ================= 오레마스 =================  */
 const say=t=>{const e=$('omMsg');if(e)e.textContent=t};
 /* 10-26 오레마스 상태 나누기: 배틀 · 포켓몬이 따로 담겨 om_get_state 로 합쳐 읽는다. 함수가 없는 옛 DB 면 표에서 */
 async function omState(id){try{const r=await fetch(`${OM.url}/rest/v1/rpc/om_get_state`,{method:'POST',headers:{apikey:OM.key,'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({p_room:id})});if(r.ok){const j=await r.json();if(j&&j.data)return [{data:j.data}]}}catch(e){}return rest(`om_state?room=eq.${encodeURIComponent(id)}&select=data`)}
 async function rest(path){const r=await fetch(`${OM.url}/rest/v1/${path}`,{headers:{apikey:OM.key,Accept:'application/json'}});if(!r.ok)throw new Error(`${r.status} ${(await r.text()).slice(0,120)}`);return r.json()}
 function roomIdOf(s){s=String(s||'').trim();const m=s.match(/[#?&]r=([A-Za-z0-9_-]+)/)||s.match(/^([A-Za-z0-9_-]{4,})$/);return m?m[1]:''}
 const hm=at=>{const d=new Date(at);return isNaN(d)?'':`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
 const day=at=>{const d=new Date(at);return isNaN(d)?'':`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
 function textToks(str,fmt){const out=[];String(str||'').split('\n').forEach((ln,i)=>{if(i)out.push({t:'br'});if(ln)out.push({t:'text',v:ln,...(fmt||{})})});return out}

 /* 오레마스 로그 한 줄 → 정리기 메시지 (null 이면 뺀다) */
 function convert(r,o,T){const d=r.data||{};let kind=r.kind;if(kind==='chat'&&d.bat)kind=d.bat;T=T||{};
  const base={id:uid(),ts:hm(r.at)};
  if(kind==='whisper'){if(!o.wh||!d.t)return null;return{...base,name:r.who||'',to:String(d.toName||d.to||''),type:'whisper',tokens:textToks(d.t)}}   /* 서버는 귓속말을 내주지 않는다. 내보낸 파일(내 귓속말)에 든 것만 */
  if(kind==='sys'){if(!o.battle)return null;return{...base,type:'sys',tokens:textToks(d.t)}}
  if(kind==='dice'){if(!o.dice)return null;const t=String(d.t||'');const m=t.match(/^(.*?)\s*=\s*([^=]+)$/);return{...base,name:(T[d.from]&&T[d.from].name)||r.who||'',type:d.ch==='ooc'?'ooc':'say',tokens:m?[{t:'roll',expr:m[1].trim(),res:m[2].trim()}]:textToks(t)}}
  if(kind==='battle'){if(!o.battle)return null;const t=String(d.t||'');const m=t.match(/^【([^】]+)】\s*([^\n]*)\n?([\s\S]*)$/);
   const tk=m?[{t:'text',v:`【${m[1]}】 `,b:true},{t:'text',v:m[2],b:true},...(m[3].trim()?[{t:'br'},...textToks(m[3].trim())]:[])]:textToks(t);
   if(d.eff)tk.push({t:'br'},...textToks(String(d.eff).trim(),{i:true}));
   return{...base,type:'sys',tokens:tk}}
  if(kind==='chat'){if(d.clear||d.room)return null;if(d.sms&&!o.sms)return null;

 /* ---------- 세션 정보 ---------- */
 const dlg=document.createElement('dialog');dlg.className='mtdlg';document.body.appendChild(dlg);
 async function info(id){const log=await getLog(id);if(!log)return toast('로그를 열지 못했어요');const m=log.meta||{};
  dlg.innerHTML=`<h3>세션 정보</h3><div style="font-size:.85rem;margin:-4px 0 10px;opacity:.8">${esc(log.title)}</div>
   <div class="two"><label>화 번호<input type="text" id="mdEp" value="${esc(m.ep??'')}" placeholder="예) 4"></label><label>플레이한 날<input type="date" id="mdDate" value="${esc(m.date||'')}"></label></div>
   <label>참가자<input type="text" id="mdPl" value="${esc(m.players||'')}" placeholder="예) 느긋하게 · 마히루 · 퓨리나"></label>
   <label>태그 <span style="opacity:.7">쉼표로 나눠요</span><input type="text" id="mdTag" value="${esc((m.tags||[]).join(', '))}" placeholder="예) 무진, 등대, 보스전"></label>
   <label>한 줄 요약 · 메모<textarea id="mdSum" rows="4" placeholder="이번 세션에 있었던 일">${esc(m.summary||'')}</textarea></label>
   <label class="ck"><input type="checkbox" id="mdNc" ${log.noCloud?'checked':''}> 이 로그는 보관소에 올리지 않음 (GM 개인 메모 등)</label>
   <div class="acts"><button type="button" class="btn" id="mdX">취소</button><button type="button" class="btn primary" id="mdOk">저장</button></div>`;
  dlg.showModal();$('mdX').onclick=()=>dlg.close();
  $('mdOk').onclick=async()=>{const nm={ep:$('mdEp').value.trim(),date:$('mdDate').value,players:$('mdPl').value.trim(),tags:$('mdTag').value.split(/[,，]/).map(x=>x.trim().replace(/^#/,'')).filter(Boolean),summary:$('mdSum').value.trim()};
   const nc=$('mdNc').checked;const wasCloud=CL.idx.has(id);log.meta=Object.values(nm).some(v=>Array.isArray(v)?v.length:v)?nm:null;log.noCloud=nc||undefined;dlg.close();touch(log);flush();
   if(nc&&wasCloud&&UP()){try{await api(`docs?kind=eq.mtlog&id=eq.${encodeURIComponent(id)}`,{method:'DELETE'});CL.idx.delete(id);toast('보관소에서 내렸어요 — 이 브라우저에만 남아요')}catch(err){toast('보관소에서 내리지 못했어요: '+err.message)}}
   else toast('세션 정보를 저장했어요');renderList();if(S.cur===id)renderLog()}}

 /* 로그 머리에 세션 정보 (저장한 HTML 에도) */
 const oBuild=buildLog;buildLog=function(log){const r=oBuild.apply(this,arguments);try{const m=log&&log.meta;if(m&&r&&r.html){const bits=[m.ep?`<b>${esc(m.ep)}화</b>`:'',m.date?esc(String(m.date).replace(/-/g,'.')):'',m.players?esc(m.players):'',(m.tags||[]).map(t=>'#'+esc(t)).join(' ')].filter(Boolean).join(' · ');
   const add=`<div class="log-sess">${bits}${m.summary?`<p>${esc(m.summary)}</p>`:''}</div>`;r.html=r.html.replace('<div class="log-meta">',add+'<div class="log-meta">')}}catch(e){}return r};
 $('logcss').textContent+='\n.log-sess{margin:8px 0 2px;font-size:.88em;color:var(--muted)}.log-sess b{color:var(--fg)}.log-sess p{margin:6px 0 0;white-space:pre-wrap;color:var(--fg);opacity:.85}';

 /* ---------- 보기: 화면에 맞춤 (좌우 여백 없이) ---------- */
 (()=>{const lw=$('sLw');if(!lw)return;lw.max='1600';const fld=lw.closest('.field');if(!fld)return;const lab=document.createElement('label');lab.className='hint';lab.style.cssText='display:flex;gap:6px;align-items:center;margin-top:4px';
  lab.innerHTML='<input type="checkbox" id="mtFit"> 넓게 보기 (화면 폭에 맞춰 최대 1000px · 저장한 HTML 은 로그 폭을 따른다)';fld.after(lab);const on=!!ls.get('mtl-fit',true);$('mtFit').checked=on;document.documentElement.classList.toggle('fitlog',on);
  $('mtFit').onchange=()=>{ls.set('mtl-fit',$('mtFit').checked);document.documentElement.classList.toggle('fitlog',$('mtFit').checked)}})();

 /* 10-26 망령: ?view=로그ID — 세션 노트 「기록」 탭에서 열기. 보관소 목록을 읽은 뒤 그 로그를 고른다(본문은 getLog 가 받아 온다). 주소에서는 지운다 */
 const VIEW_ID=new URLSearchParams(location.search).get('view');
 if(VIEW_ID){try{const u=new URL(location.href);u.searchParams.delete('view');history.replaceState(null,'',u.pathname+u.search+u.hash)}catch(e){}}
 const go=async()=>{await pull(true);if(VIEW_ID){if(!S.index.some(x=>x.id===VIEW_ID)){const c=CL.idx.get(VIEW_ID);if(c)S.index.push({id:VIEW_ID,title:c.title||'로그',count:c.count,assets:[],names:[],folder:null,created:c.created,upd:c.u,meta:c.meta,remote:1})}
   if(S.index.some(x=>x.id===VIEW_ID)){await selectLog(VIEW_ID);const el=document.querySelector(`.li[data-fid="${CSS.escape(VIEW_ID)}"]`);if(el)el.scrollIntoView({block:'center'});const lg=document.getElementById('log')||document.querySelector('.log,#out,main');if(lg)lg.scrollIntoView({behavior:'smooth',block:'start'})}else toast('보관소에 그 로그가 없어요')}};
 (window.OM_LOG_IMPORT&&window.OM_LOG_IMPORT.boot?window.OM_LOG_IMPORT.boot:Promise.resolve()).then(()=>setTimeout(go,600));
 setInterval(()=>{checkTree();checkSpk()},4000);addEventListener('pagehide',()=>{for(const [id,t] of upT){clearTimeout(t);upload(id)}});
 /* ---------- 지문(*…*) 글꼴 · 색 · 기울임 (10-25 망령) — 저장한 HTML 에도 들어간다 ---------- */
 (()=>{const fg=$('fGm');const fld=fg&&fg.closest('.field');if(!fld)return;
  const box=document.createElement('div');box.innerHTML=`<div class="field"><span>지문 글꼴</span><select id="fEm"></select><span></span></div>
   <div class="field"><span>지문 모양</span><span class="mtem"><input type="color" id="cEm" title="지문 글자 색"><button type="button" class="btn" id="cEmX" title="지문 색을 기본(흐린 글자)으로">기본 색</button><label class="hint" style="display:flex;gap:5px;align-items:center"><input type="checkbox" id="iEm"> 기울임</label></span><span></span></div>`;
  fld.after(...box.children);
  $('fEm').innerHTML='<option value="">본문과 같게</option>'+Object.keys(FONTS).map(f=>`<option value="${f}" style="font-family:'${f}'">${f}</option>`).join('');
  const sync=()=>{const st=S.style;$('fEm').value=st.fEmote||'';$('cEm').value=st.emoteC||'#8a8f9c';$('cEm').style.opacity=st.emoteC?1:.5;$('iEm').checked=st.emoteIt!==false};
  const oSync=syncStyleUI;syncStyleUI=function(){const r=oSync.apply(this,arguments);try{sync()}catch(e){}return r};sync();
  const set=p=>{setStyle(p);if(S.style.fEmote)ensureFont(S.style.fEmote)};
  $('fEm').onchange=()=>set({fEmote:$('fEm').value||''});$('cEm').oninput=()=>set({emoteC:$('cEm').value});$('cEmX').onclick=()=>set({emoteC:''});$('iEm').onchange=()=>set({emoteIt:$('iEm').checked});
  if(S.style.fEmote)ensureFont(S.style.fEmote)})();
 const oVars=styleVars;styleVars=function(){const st=S.style;let r=oVars.apply(this,arguments);r+=`;--f-emote:${st.fEmote?fontStack(st.fEmote):'inherit'};--emote-c:${st.emoteC||'var(--muted)'};--emote-st:${st.emoteIt===false?'normal':'italic'}`;return r};
 const oFL=fontLink;fontLink=function(list){return oFL.call(this,[...(list||[]),S.style.fEmote].filter(Boolean))};
 $('logcss').textContent+='\n.emote .line{font-family:var(--f-emote,inherit);color:var(--emote-c,var(--muted));font-style:var(--emote-st,italic)}\n.emote .line i,.emote .line em{font-style:inherit}';
 window.MTL_CLOUD={pull,upload,CL};
})();
</script>
