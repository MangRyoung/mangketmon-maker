<style>

<script>
(function () {
  'use strict';
  const KEY = 'mtl-ai';
  /* 비밀 값(sa · nai)은 기억할 때 암호로 잠가서만 저장한다(AES-GCM, 키는 PBKDF2 31만 번). 저장 공간에는 암호문만 남는다.
   같은 주소(mangryoung.github.io)의 다른 도구가 저장 공간을 같이 쓰기 때문. */
  const ALT_DEFAULT = 'us-central1, us-east5, europe-west4, asia-northeast1';
  const mem = { sa: '', region: 'global', model: '', nai: '', keep: false, safety: 'default', alts: ALT_DEFAULT, model2: '' };
  let locked = null,
    pass = '';
  try {
    const s = ls.get(KEY, null);
    if (s) {
      for (const k of ['region', 'model', 'safety']) if (s[k]) mem[k] = s[k];
      for (const k of ['alts', 'model2']) if (typeof s[k] === 'string') mem[k] = s[k];
      if (s.enc) {
        locked = s.enc;
        mem.keep = true;
      } else if (s.sa || s.nai) {
        mem.sa = s.sa || '';
        mem.nai = s.nai || '';
        ls.set(KEY, { region: mem.region, model: mem.model, safety: mem.safety, alts: mem.alts, model2: mem.model2 });
      } /* 옛 방식(그대로 저장)은 읽고 바로 지운다 */
    }
  } catch (e) {}
  const hex = b => Array.from(b, x => x.toString(16).padStart(2, '0')).join(''),
    unhex = h => Uint8Array.from(h.match(/../g) || [], x => parseInt(x, 16));
  async function passKey(pw, salt) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 310000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, [
      'encrypt',
      'decrypt'
    ]);
  }
  async function lockUp(pw) {
    const salt = crypto.getRandomValues(new Uint8Array(16)),
      iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(
      await crypto.subtle.encrypt(
        { name: 'AES-GCM', iv },
        await passKey(pw, salt),
        new TextEncoder().encode(JSON.stringify({ sa: mem.sa, nai: mem.nai }))
      )
    );
    return { salt: hex(salt), iv: hex(iv), ct: hex(ct) };
  }
  async function unlock(pw) {
    const d = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unhex(locked.iv) }, await passKey(pw, unhex(locked.salt)), unhex(locked.ct));
    const o = JSON.parse(new TextDecoder().decode(d));
    mem.sa = o.sa || '';
    mem.nai = o.nai || '';
    pass = pw;
    locked = null;
  }
  async function persist() {
    const plainPart = { region: mem.region, model: mem.model, safety: mem.safety, alts: mem.alts, model2: mem.model2 };
    if (mem.keep && pass && (mem.sa || mem.nai)) {
      plainPart.enc = await lockUp(pass);
    }
    ls.set(KEY, plainPart);
  }
  const E = (tag, attrs, html) => {
    const el = document.createElement(tag);
    for (const k in attrs || {}) el.setAttribute(k, attrs[k]);
    if (html != null) el.innerHTML = html;
    return el;
  };

  /* ---------- Vertex AI ---------- */
  const b64u = bytes => {
    let t = '';
    for (const x of bytes) t += String.fromCharCode(x);
    return btoa(t).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  };
  const enc = o => b64u(new TextEncoder().encode(JSON.stringify(o)));
  let tok = { v: '', exp: 0, who: '' };
  let waitNote = null;
  function readSA() {
    let sa;
    try {
      sa = JSON.parse(mem.sa.trim());
    } catch (e) {
      throw new Error('서비스 계정 JSON 을 읽지 못했어요. 설정 탭에서 다시 붙여 넣어 주세요.');
    }
    if (!sa.private_key || !sa.client_email || !sa.project_id)
      throw new Error('서비스 계정 JSON 에 private_key · client_email · project_id 가 있어야 해요.');
    return sa;
  }
  async function accessToken() {
    const sa = readSA();
    if (tok.v && tok.who === sa.client_email && Date.now() < tok.exp) return { token: tok.v, sa };
    const pem = String(sa.private_key)
      .replace(/-----[^-]+-----/g, '')
      .replace(/\s+/g, '');
    const der = Uint8Array.from(atob(pem), c => c.charCodeAt(0));
    const key = await crypto.subtle.importKey('pkcs8', der, { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' }, false, ['sign']);
    const now = Math.floor(Date.now() / 1000);
    const head = enc({ alg: 'RS256', typ: 'JWT' }),
      body = enc({
        iss: sa.client_email,
        scope: 'https://www.googleapis.com/auth/cloud-platform',
        aud: 'https://oauth2.googleapis.com/token',
        iat: now,
        exp: now + 3300
      });
    const sig = new Uint8Array(await crypto.subtle.sign('RSASSA-PKCS1-v1_5', key, new TextEncoder().encode(head + '.' + body)));
    const r = await fetch('https://oauth2.googleapis.com/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'grant_type=' + encodeURIComponent('urn:ietf:params:oauth:grant-type:jwt-bearer') + '&assertion=' + head + '.' + body + '.' + b64u(sig)
    });
    if (!r.ok) {
      let d = '';
      try {
        d = (await r.json()).error_description || '';
      } catch (e) {}
      throw new Error('Google 접근 토큰을 받지 못했어요 (HTTP ' + r.status + ') ' + String(d).slice(0, 160));
    }
    const j = await r.json();
    tok = { v: j.access_token, exp: Date.now() + 50 * 60 * 1000, who: sa.client_email };
    return { token: tok.v, sa };
  }
  const pace = { last: 0, cool: 0, good: '', bad: new Set() };
  /* 한 번 부르기. 돌려주는 것: {text, finish} */
  async function gemini(system, user, opt) {
    opt = opt || {};
    if (!mem.model) throw new Error('설정 탭에서 모델 이름을 넣어 주세요.');
    const { token, sa } = await accessToken();
    const body = {
      contents: [{ role: 'user', parts: opt.parts || [{ text: user }] }],
      systemInstruction: { parts: [{ text: system }] },
      generationConfig: { temperature: opt.temperature ?? 0.9, maxOutputTokens: opt.max ?? 12000 }
    };
    if (opt.json) body.generationConfig.responseMimeType = 'application/json';
    if (mem.safety === 'loose')
      body.safetySettings = [
        'HARM_CATEGORY_HARASSMENT',
        'HARM_CATEGORY_HATE_SPEECH',
        'HARM_CATEGORY_SEXUALLY_EXPLICIT',
        'HARM_CATEGORY_DANGEROUS_CONTENT'
      ].map(c => ({ category: c, threshold: 'BLOCK_ONLY_HIGH' }));
    /* 부를 곳 목록: 설정한 지역 · 모델이 먼저, 429 가 나면 「돌려 볼 지역」들, 그다음 「대신 쓸 모델」로 같은 지역들 (2026-11-26 망령 「429 가 해도 해도 심각」).
     Vertex 의 429 는 지역 · 모델마다 따로 걸리는 공용 용량이라, 한 곳이 막혀도 다른 곳은 열려 있을 때가 많다 */
    const regs = [
      mem.region || 'global',
      ...String(mem.alts || '')
        .split(/[\s,]+/)
        .filter(Boolean)
    ].filter((x, k, a) => /^[a-z0-9-]+$/.test(x) && a.indexOf(x) === k);
    const mods = [mem.model, (mem.model2 || '').trim()].filter((x, k, a) => x && a.indexOf(x) === k);
    const T = [];
    for (const m of mods) for (const g of regs) T.push({ g, m, k: g + '|' + m });
    const urlOf = t =>
      'https://' +
      (t.g === 'global' ? 'aiplatform.googleapis.com' : t.g + '-aiplatform.googleapis.com') +
      '/v1/projects/' +
      encodeURIComponent(sa.project_id) +
      '/locations/' +
      encodeURIComponent(t.g) +
      '/publishers/google/models/' +
      encodeURIComponent(t.m) +
      ':generateContent';
    const live = () => T.filter(t => !pace.bad.has(t.k));
    /* · 부르기 사이는 적어도 4초
     · 429 · 500 · 503 → 바로 다음 곳으로. 한 바퀴 다 막히면 15 → 40 → 90초(±25%) 쉬고 다시 한 바퀴. Retry-After 가 오면 그 값 이상
     · 설정한 곳이 아닌 데서 400 · 403 · 404(그 지역에 그 모델이 없음)면 이번 창에서는 그곳을 건너뛴다
     · 통한 곳은 기억해 두고 다음 부르기는 거기부터 */
    const sleep = ms =>
      new Promise((res, rej) => {
        if (ms <= 0) return res();
        const t = setTimeout(res, ms);
        if (opt.signal)
          opt.signal.addEventListener(
            'abort',
            () => {
              clearTimeout(t);
              rej(new DOMException('aborted', 'AbortError'));
            },
            { once: true }
          );
      });
    const waits = [15, 40, 90];
    let r = null,
      cyc = 0,
      tried = new Set(),
      cur = T.find(t => t.k === pace.good && !pace.bad.has(t.k)) || T[0];
    const hit = [];
    for (;;) {
      await sleep(Math.max(pace.last + 4000, pace.cool) - Date.now());
      pace.last = Date.now();
      const x = await fetch(urlOf(cur), {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
        signal: opt.signal
      });
      pace.last = Date.now();
      if (x.ok) {
        r = x;
        if (pace.good !== cur.k && cur !== T[0] && waitNote)
          waitNote('「' + cur.g + (cur.m !== mem.model ? ' · ' + cur.m : '') + '」 쪽으로 통했어요. 이번 창에서는 여기부터 불러요.');
        pace.good = cur.k;
        break;
      }
      if (cur !== T[0] && [400, 403, 404].includes(x.status)) {
        pace.bad.add(cur.k);
      } else {
        r = x;
        if (![429, 500, 503].includes(x.status)) break;
        hit.push(cur.g + (cur.m !== mem.model ? '·' + cur.m : '') + ' ' + x.status);
      }
      if (!pace.bad.has(cur.k)) tried.add(cur.k);
      const L = live();
      if (!L.length) break;
      const at = T.indexOf(cur);
      const nx = [...T.slice(at + 1), ...T.slice(0, at + 1)].find(t => !pace.bad.has(t.k));
      if (L.every(t => tried.has(t.k))) {
        if (cyc >= waits.length) break;
        const ra = parseInt(x.headers.get('retry-after') || '', 10);
        const sec = Math.round(Math.max(ra > 0 && ra < 300 ? ra : 0, waits[cyc] * (0.75 + Math.random() * 0.5)));
        cyc++;
        tried.clear();
        pace.cool = Date.now() + sec * 1000;
        if (waitNote)
          waitNote(
            'Google 쪽이 ' +
              (L.length > 1 ? L.length + '곳 모두 ' : '') +
              '붐벼서(HTTP ' +
              x.status +
              ') ' +
              sec +
              '초 쉬었다가 다시 해 볼게요… (' +
              cyc +
              '/' +
              waits.length +
              ')'
          );
        await sleep(sec * 1000);
      } else if (waitNote)
        waitNote('「' + cur.g + '」 가 붐벼서(HTTP ' + x.status + ') 「' + nx.g + (nx.m !== cur.m ? ' · ' + nx.m : '') + '」 로 돌려 볼게요…');
      cur = nx;
    }
    if (!r) throw new Error('부를 수 있는 지역이 없어요. 설정 탭의 지역 · 모델 이름을 확인해 주세요.');
    if (!r.ok) {
      let d = '';
      try {
        d = ((await r.json()).error || {}).message || '';
      } catch (e) {}
      if (r.status === 401) tok.exp = 0;
      if (r.status === 429)
        throw new Error(
          'Google 쪽 할당량이 잠시 찼어요 (HTTP 429). ' +
            [...new Set(hit)].slice(-8).join(', ') +
            ' — 돌려 가며 여러 번 해 봤지만 안 됐어요. 몇 분 뒤에 「이어서 하기」 나 다시 눌러 주세요. ' +
            String(d).slice(0, 300)
        );
      throw new Error('모델 호출이 거절됐어요 (HTTP ' + r.status + ') ' + String(d).slice(0, 240));
    }
    const j = await r.json();
    const c = (j.candidates || [])[0] || {};
    const text = ((c.content || {}).parts || []).map(p => p.text || '').join('');
    if (!text) {
      const why = (j.promptFeedback || {}).blockReason || c.finishReason || '알 수 없음';
      throw new Error('모델이 글을 돌려주지 않았어요 (사유: ' + why + '). 안전 필터에 걸렸을 수 있어요.');
    }
    return { text, finish: c.finishReason || '' };
  }

  /* ---------- 로그 → 글 줄 ---------- */
  function logLines(l, ill) {
    const o = opts();
    const out = [];
    const tail = x => out.push('[삽화 ' + x.k + '] ' + (x.caption || ''));
    for (const m of l.messages) {
      if (m.ill) {
        const x = ill && ill.byMsg.get(m.id);
        if (x) tail(x);
        continue;
      } /* 로그에 넣은 삽화: 「[그림]」 글자로 보내지 않고 자리 표시만 */
      if (!(m.type === 'bgm' || (m.name && cfg(m.name).hide) || m.type === 'ooc' || (m.type === 'whisper' && !o.optWhisper))) {
        const n = m.name ? cfg(m.name).name : '';
        const t = (window.OM_PLAIN || plain)(m.tokens).replace(/\s+\n/g, '\n').trim();
        if (t)
          out.push(
            m.type === 'emote'
              ? ('* ' + n + ' ' + t).trim()
              : m.type === 'whisper'
                ? n + ' (귓속말' + (m.to ? ' → ' + cfg(m.to).name : '') + '): ' + t
                : n
                  ? n + ': ' + t
                  : '[지문] ' + t
          );
      }
      if (ill && ill.after.has(m.id)) ill.after.get(m.id).forEach(tail);
    }
    if (ill) ill.rest.forEach(tail);
    return out;
  }
  function chunks(lines, size) {
    const out = [];
    let cur = [],
      n = 0;
    for (const ln of lines) {
      if (n + ln.length > size && cur.length) {
        out.push(cur);
        cur = [];
        n = 0;
      }
      cur.push(ln);
      n += ln.length + 1;
    }
    if (cur.length) out.push(cur);
    return out;
  }
  const SPLIT = '===요약===';
  const NOVEL_KEY = 'mtl-ai-novel';
  const NOVEL_GUIDE_DEFAULT = [
    '로그에 있는 사건 · 대사의 뜻 · 판정 결과를 바꾸지 않는다. 로그에 없는 사건 · 인물 · 설정을 지어내지 않는다.',
    '「이름: 대사」 꼴을 그대로 옮기지 않는다. 지문과 따옴표 대사로 풀어 쓰고, 누가 말했는지는 지문으로 알린다. 대사는 뜻과 말투를 살리되 글로 읽기 좋게 다듬는다.',
    '주사위 · 판정 · 수치가 적힌 줄(대괄호 안의 굴림, 명중 · 피해 숫자, 카드 꼴 시스템 글)은 숫자를 쓰지 않고, 성공 · 실패 · 얼마나 아슬아슬했는지를 장면으로 보여 준다.',
    '규칙 이야기, 진행 안내, 잡담처럼 이야기 바깥의 줄은 뺀다.',
    '문단은 짧게 끊고, 장면이 바뀌면 빈 줄 뒤에 「***」 한 줄을 둔다.',
    '제목 · 머리말 · 해설 · 맺음말은 쓰지 않는다. 본문만 쓴다.'
  ].join('\n');
  const novelCfg = Object.assign({ guide: '' }, ls.get(NOVEL_KEY, {}));
  const novelGuide = () => (novelCfg.guide && novelCfg.guide.trim()) || NOVEL_GUIDE_DEFAULT;
  /* 지침 = 머리말 + 작성 지침(고칠 수 있음) + 고른 값(시점 · 분량 · 문체) + 이어 쓰기 · 요약 규칙(고정: 구간을 잇는 데 필요) */
  function novelSystem(o) {
    const pov =
      o.pov === 'first'
        ? '1인칭 시점으로 쓴다. 화자는 「' + (o.povWho || '주인공') + '」 이고, 그 인물이 보고 듣고 느낀 것만 쓴다.'
        : '3인칭 시점으로 쓴다. 장면마다 중심 인물 한 명의 가까이에서 서술한다.';
    const len =
      o.len === 'tight'
        ? '분량은 로그보다 짧게, 군더더기 없이 압축한다.'
        : o.len === 'rich'
          ? '분량은 넉넉하게. 로그에 드러난 행동 · 표정 · 분위기를 살려 묘사를 보탠다(없는 사건은 만들지 않는다).'
          : '분량은 로그와 비슷하게.';
    return [
      '너는 TRPG 세션 로그를 한국어 웹소설 본문으로 옮기는 작가다.',
      '[작성 지침]',
      novelGuide(),
      '',
      '[이번 글의 설정]',
      '- ' + pov,
      '- ' + len,
      o.style ? '- 문체에 대한 주문: ' + o.style : '',
      '',
      '[이어 쓰기]',
      '앞부분에서 이어지는 글이면, 주어진 「바로 앞 본문」 에 자연스럽게 이어 쓴다(되풀이하지 않는다).',
      o.ill
        ? '로그에 「[삽화 N] 설명」 줄이 있으면 그 자리에 그림이 들어간다. 그 장면을 쓴 문단 바로 뒤에 [[삽화 N]] 만 적은 줄을 따로 한 줄 둔다(번호는 로그 그대로, 한 번씩만, 없는 번호를 지어내지 않는다). 설명 글 자체는 본문에 옮기지 않는다.'
        : '',
      '본문을 다 쓴 다음, 맨 끝에 ' +
        SPLIT +

  function parseOrder(text) {

  async function naiGenerate(order, signal) {
    if (!mem.nai) throw new Error('설정 탭에서 NovelAI 토큰을 넣어 주세요.');

    function illList() {
      if (!l) return [];
      const out = [],
        seen = new Set();
      let ch = false;
      l.messages.forEach((m, idx) => {
        if (!m.ill) return;
        const im = (m.tokens || []).find(t => t.t === 'img' && t.src);
        if (!im) return;
        let k = IL.keys[m.id];
        if (!k) {
          k = IL.keys[m.id] = ++IL.seq;
          ch = true;
        }
        out.push({
          k,
          src: im.src,
          caption: (m.tokens || [])
            .filter(t => t.t === 'text')
            .map(t => t.v)
            .join(' ')
            .trim(),
          idx,
          msgId: m.id
        });
        seen.add(k);
      });
      IL.orders.forEach(o => {
        if (!o.src || seen.has(o.k)) return;
        const idx = l.messages.findIndex(m => m.id === o.afterId);
        out.push({ k: o.k, src: o.src, caption: o.caption || '', idx: idx < 0 ? l.messages.length : idx + 0.5, afterId: idx < 0 ? null : o.afterId });
      });
      if (ch) keepIll();
      return out.sort((a, b) => a.idx - b.idx);
    }
    function illHook() {
      const L = illList();

        after = new Map(),
        rest = [];
      for (const x of L) {
        if (x.msgId) byMsg.set(x.msgId, x);
        else if (x.afterId) {
          if (!after.has(x.afterId)) after.set(x.afterId, []);
          after.get(x.afterId).push(x);
        } else rest.push(x);
      }
      return { byMsg, after, rest, list: L };
    }

<div data-img></div>

        }
      };
      q('aiDrawAll').onclick = async () => {
        takeArt();
        irun = new AbortController();
        busy(true);
        let ok = 0;
        try {
          for (const o of IL.orders.slice()) {
            if (irun.signal.aborted) break;
            if (o.src) continue;
            ist('그리는 중… ' + (ok + 1));
            if (await o.draw(irun.signal)) ok++;
            else if (irun.signal.aborted) break;
          }
          ist(ok + '장을 그렸어요.');
        } finally {
          irun = null;
          busy(false);
        }
      };
      q('aiIllStop').onclick = () => {
        if (irun) irun.abort();
      };
      if (ikey)
        illReady = idb
          .get(ikey)
          .then(v => {
            if (!v) return;
            IL.seq = +v.seq || 0;
            IL.keys = v.keys || {};
            IL.orders = (v.orders || []).map(o =>
              Object.assign({ caption: '', orientation: 'landscape', scene: '', negative: '', characters: [] }, o)
            );
            IL.orders.forEach(o => {
              if (!o.k) o.k = ++IL.seq;
            });
            IL.orders.forEach((o, i) => q('aiCards').appendChild(card(o, i)));
            q('aiDrawAll').hidden = !IL.orders.length;
            const dn = IL.orders.filter(o => o.src).length;
            if (IL.orders.length) ist('전에 만든 삽화 ' + IL.orders.length + '장면을 불러왔어요' + (dn ? ' · 그림 ' + dn + '장' : ''));
          })
          .catch(() => {});
      ['aiAutoLook', 'aiN', 'aiNm', 'aiSt', 'aiArt', 'aiNeg'].forEach(id => q(id).addEventListener('change', takeArt));
    })();
    /* 웹소설 */
    const names = [...new Set((l ? l.messages : []).filter(m => m.name && !cfg(m.name).hide).map(m => cfg(m.name).name))];
    q('aiWho').innerHTML = names.map(n => `<option>${esc(n)}</option>`).join('');
    q('aiGuide').value = novelGuide();
    const takeGuide = () => {
      const v = q('aiGuide').value.trim();
      novelCfg.guide = v === NOVEL_GUIDE_DEFAULT.trim() ? '' : v;
      ls.set(NOVEL_KEY, novelCfg);
    };
    q('aiGuideSave').onclick = () => {
      takeGuide();
      q('aiGuideStat').textContent = novelCfg.guide ? '저장했어요 (고친 지침)' : '저장했어요 (기본 지침)';
    };
    q('aiGuideReset').onclick = () => {
      novelCfg.guide = '';
      ls.set(NOVEL_KEY, novelCfg);
      q('aiGuide').value = NOVEL_GUIDE_DEFAULT;
      q('aiGuideStat').textContent = '기본값으로 돌렸어요';
    };
    const st = t => (q('aiStat').textContent = t);
    const bar = p => (q('aiBar').style.width = Math.round(p * 100) + '%');
    let state = null;
    const nkey = l ? 'ai-novel:' + l.id : null;
    if (nkey)
      idb
        .get(nkey)
        .then(v => {
          if (v && v.text && !q('aiOut').value) {
            q('aiOut').value = v.text;
            state = v.state || null;
            st('전에 만든 글을 불러왔어요' + (state && state.next < state.total ? ' · ' + state.next + '/' + state.total + ' 구간까지' : ''));
            q('aiMore').hidden = !(state && state.next < state.total);
            illCount();
          }
        })
        .catch(() => {});
    const keepOut = () => {
      if (nkey) idb.set(nkey, { text: q('aiOut').value, state }).catch(() => {});
    };
    q('aiOut').addEventListener('change', keepOut);
    async function go(resume) {
      if (!l) {
        st('먼저 로그를 골라 주세요.');
        return;
      }
      if (!mem.sa || !mem.model) {
        tab('set');
        return;
      }
      takeGuide();
      await illReady;
      const hook = q('aiIllIn').checked ? illHook() : null;
      const o = {
        title: l.title,
        pov: q('aiPov').value,
        povWho: q('aiWho').value,
        len: q('aiLen').value,
        style: q('aiStyle').value.trim(),
        memo: q('aiMemo').value.trim(),
        ill: !!(hook && hook.list.length)
      };
      const parts = chunks(logLines(l, hook), Number(q('aiSize').value) || 9000);
      if (!parts.length) {
        st('옮길 줄이 없어요.');
        return;
      }
      if (!resume || !state || state.total !== parts.length) {
        if (q('aiOut').value.trim() && !confirm('지금 있는 글을 지우고 처음부터 다시 만들까요?')) return;
        state = { next: 0, total: parts.length, summary: '' };
        q('aiOut').value = '';
      }
      run = new AbortController();
      q('aiGo').hidden = true;
      q('aiMore').hidden = true;
      q('aiStop').hidden = false;
      const sys = novelSystem(o);
      try {
        for (let i = state.next; i < parts.length; i++) {
          st(i + 1 + ' / ' + parts.length + ' 구간을 쓰는 중…');
          bar(i / parts.length);
          const cur = q('aiOut').value;
          const r = await gemini(sys, novelUser(o, { names, summary: state.summary, tail: cur.slice(-600) }, parts[i], i, parts.length), {
            signal: run.signal
          });
          const k = r.text.lastIndexOf(SPLIT);
          const bodyText = (k >= 0 ? r.text.slice(0, k) : r.text).trim();
          if (k >= 0)
            state.summary = r.text
              .slice(k + SPLIT.length)
              .trim()
              .slice(0, 1500);
          q('aiOut').value = (cur ? cur.replace(/\s+$/, '') + '\n\n' : '') + bodyText;
          q('aiOut').scrollTop = q('aiOut').scrollHeight;
          state.next = i + 1;
          keepOut();
          illCount();
          if (r.finish === 'MAX_TOKENS') st('주의: ' + (i + 1) + '구간이 길이 제한에 걸려 끝이 잘렸을 수 있어요.');
        }
        bar(1);
        st('다 됐어요 · ' + parts.length + '구간 · ' + q('aiOut').value.length.toLocaleString() + '자');
      } catch (e) {
        if (e && e.name === 'AbortError') st('멈췄어요 · ' + state.next + ' / ' + parts.length + ' 구간까지 썼어요.');
        else st('멈춤 (' + (state.next + 1) + '구간): ' + String(e.message || e));
        q('aiMore').hidden = !(state.next < parts.length);
      } finally {
        run = null;
        q('aiGo').hidden = false;
        q('aiStop').hidden = true;
        keepOut();
      }
    }
    q('aiGo').onclick = () => go(false);
    q('aiMore').onclick = () => go(true);
    q('aiStop').onclick = () => {
      if (run) run.abort();
    };
    const title = () => safeName((l ? l.title : 'log') + ' 소설');
    /* 본문 속 삽화 자리: [[삽화 N]] 한 줄 */
    const MARK = /^\[\[삽화\s*(\d+)\]\]$/;
    const marksIn = t => new Set([...t.matchAll(/\[\[삽화\s*(\d+)\]\]/g)].map(m => +m[1]));
    const illCount = () =>
      illReady.then(() => {
        const L = illList();
        const has = marksIn(q('aiOut').value);
        const n = L.filter(x => has.has(x.k)).length;
        q('aiIllCnt').textContent = L.length
          ? '· 삽화 ' + L.length + '장' + (q('aiOut').value.trim() ? ' (본문에 자리 ' + n + '곳)' : '')
          : '· 아직 그려 둔 삽화가 없어요 (「삽화」 탭)';
        q('aiIllPlace').hidden = !L.length || !q('aiOut').value.trim() || n >= L.length;
      });
    box.querySelectorAll('.ai-tabs button').forEach(b => b.addEventListener('click', illCount));
    q('aiOut').addEventListener('input', illCount);
    illCount();
    q('aiIllPlace').onclick = async () => {
      await illReady;
      const hook = illHook();
      const t = q('aiOut').value;
      const has = marksIn(t);
      const todo = hook.list.filter(x => !has.has(x.k));
      if (!todo.length) {
        st('넣을 삽화가 없어요.');
        return;
      }
      const lines = logLines(l, hook);
      const total = lines.reduce((n, x) => n + x.length + 1, 0) || 1;
      const at = {};
      let off = 0;
      for (const ln of lines) {
        const m = ln.match(/^\[삽화 (\d+)\]/);
        if (m) at[+m[1]] = off / total;
        off += ln.length + 1;
      }
      const ps = t.split(/\n{2,}/);
      const body = ps.reduce((n, x) => n + (MARK.test(x.trim()) ? 0 : x.length), 0) || 1;
      const ins = ps.map(() => []);
      for (const x of todo) {
        const goal = (at[x.k] == null ? 1 : at[x.k]) * body;
        let acc = 0,
          k = ps.length - 1;
        for (let i = 0; i < ps.length; i++) {
          if (!MARK.test(ps[i].trim())) acc += ps[i].length;
          if (acc >= goal) {
            k = i;
            break;
          }
        }
        ins[k].push('[[삽화 ' + x.k + ']]');
      }
      q('aiOut').value = ps.map((x, i) => [x, ...ins[i]].join('\n\n')).join('\n\n');
      keepOut();
      illCount();
      st('삽화 ' + todo.length + '장의 자리를 넣었어요. 줄을 옮기면 그림도 따라가요.');
    };
    const plainOut = () => {
      const cap = new Map(illList().map(x => [x.k, x.caption]));
      return q('aiOut')
        .value.split(/\n{2,}/)
        .map(p => {
          const m = p.trim().match(MARK);
          if (!m) return p;
          const c = cap.get(+m[1]);
          return c == null ? null : '[삽화' + (c ? ': ' + c : '') + ']';
        })
        .filter(p => p != null)
        .join('\n\n');
    };
    q('aiCopy').onclick = () => copyText(plainOut(), '소설');
    q('aiTxt').onclick = () => {
      const t = plainOut();
      offer(title() + '.txt', t, t);
    };
    q('aiHtml').onclick = async () => {
      await illReady;
      const t = q('aiOut').value;
      const im = new Map(illList().map(x => [x.k, x]));
      let used = 0;
      const bodyHtml = t
        .split(/\n{2,}/)
        .map(p => {
          const m = p.trim().match(MARK);
          if (m) {
            const x = im.get(+m[1]);
            if (!x || !/^data:image\//i.test(x.src)) return '';
            used++;
            return (
              '<figure><img src="' +
              esc(x.src) +
              '" alt="' +
              esc(x.caption || '삽화') +
              '">' +
              (x.caption ? '<figcaption>' + esc(x.caption) + '</figcaption>' : '') +
              '</figure>'
            );
          }
          return p.trim() === '***' ? '<p class="br">* * *</p>' : '<p>' + esc(p).replace(/\n/g, '<br>') + '</p>';
        })
        .filter(Boolean)
        .join('\n');
      const h = `<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(l ? l.title : '')}</title><style>body{max-width:720px;margin:48px auto;padding:0 20px;font:17px/1.9 'Noto Serif KR',serif;color:#222;background:#fbfaf7}h1{font-size:1.4rem;margin:0 0 2em}p{margin:0 0 1.1em;text-indent:1em;word-break:keep-all}p.br{text-align:center;text-indent:0;opacity:.5;margin:2em 0}figure{margin:2.2em 0;text-align:center}figure img{max-width:100%;border-radius:10px}figcaption{font-size:.82em;opacity:.6;margin-top:.5em}@media(prefers-color-scheme:dark){body{background:#17181b;color:#ddd}}</style></head><body><h1>${esc(l ? l.title : '')}</h1>\n${bodyHtml}\n</body></html>`;
      offer(title() + '.html', h, h);
      if (used) st('삽화 ' + used + '장을 넣어 저장했어요.');
    };
  }
  /* 단추 */
  const anchor = $('copyText');
  if (anchor) {
    const b = E('button', { class: 'btn', id: 'aiBtn', type: 'button', title: '로그를 웹소설로 (글 AI)' }, 'AI');
    anchor.parentNode.insertBefore(b, anchor);
    b.onclick = open;
  }
  window.MTL_AI = {
    gemini,
    logLines,
    chunks,
    novelSystem,
    novelUser,
    mem,
    logItems,
    illustSystem,
    illustUser,
    parseOrder,
    naiBody,
    naiGenerate,
    art,
    autoLooks,
    portraitOf,
    novelGuide,
    novelCfg
  };
})();
</script>
