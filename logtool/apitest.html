<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>연결 시험 · 로그 정리기</title>
<style>
body{font-family:system-ui,sans-serif;max-width:640px;margin:32px auto;padding:0 16px;line-height:1.6;color:#222;background:#fafafa}
h1{font-size:20px}label{display:block;margin:14px 0 4px;font-weight:600}
input{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #bbb;border-radius:8px;font-size:15px}
button{margin-top:12px;padding:9px 16px;border:0;border-radius:8px;background:#3b6fd4;color:#fff;font-size:15px;cursor:pointer}
button:disabled{opacity:.5}.box{margin-top:14px;padding:12px 14px;border-radius:10px;background:#fff;border:1px solid #ddd;white-space:pre-wrap;word-break:break-all}
.ok{border-color:#3a9a5c;background:#eefaf1}.bad{border-color:#c9534c;background:#fdf0ef}.note{color:#666;font-size:13px}
</style></head><body>
<h1>연결 시험 — 이 브라우저에서 NovelAI 에 바로 닿는지</h1>
<p class="note">로그 정리기에 삽화 기능을 넣기 전에, 브라우저가 NovelAI 서버에 직접 요청할 수 있는지 확인하는 쪽입니다. 그림은 만들지 않고 계정 정보만 한 번 읽습니다(Anlas 를 쓰지 않습니다).<br>
토큰은 이 화면에서 NovelAI 로만 보내고, 어디에도 저장하지 않습니다. 창을 닫으면 사라집니다.</p>
<label for="tk">NovelAI 토큰 (pst-… 로 시작하는 값)</label>
<input id="tk" type="password" autocomplete="off" spellcheck="false" placeholder="여기에 붙여 넣기">
<button id="go">시험하기</button>
<div id="out" class="box">아직 시험하지 않았습니다.</div>
<script>
const $=id=>document.getElementById(id);
function show(cls,text){const o=$('out');o.className='box '+cls;o.textContent=text}
$('go').onclick=async()=>{
  const token=$('tk').value.trim().replace(/^Bearer\s+/i,'');
  if(!token){show('bad','토큰을 넣어 주세요.');return}
  $('go').disabled=true;show('','확인하는 중…');
  const t0=Date.now();
  try{
    const r=await fetch('https://image.novelai.net/user/data',{method:'GET',headers:{Authorization:'Bearer '+token,Accept:'application/json'}});
    const ms=Date.now()-t0;
    if(r.ok){
      let tier='',anlas='';
      try{const j=await r.json();const s=j.subscription||{};tier=s.tier;const b=s.trainingStepsLeft||{};anlas=(Number(b.fixedTrainingStepsLeft)||0)+(Number(b.purchasedTrainingSteps)||0)}catch(e){}
      show('ok','결과: 닿습니다 (직접 연결 가능)\n응답 '+r.status+' · '+ms+'ms\n구독 단계: '+(tier===''?'읽지 못함':tier)+' · Anlas: '+(anlas===''?'읽지 못함':anlas)+'\n\n이 글을 그대로 복사해 감우에게 알려 주세요.');
    }else if(r.status===401||r.status===403){
      show('bad','결과: 서버에는 닿았지만 토큰이 거절됐습니다 (HTTP '+r.status+')\n연결 자체는 되는 것이니, 토큰 값만 다시 확인하면 됩니다.\n\n이 글을 그대로 복사해 감우에게 알려 주세요.');
    }else{
      show('bad','결과: 서버에는 닿았지만 오류가 왔습니다 (HTTP '+r.status+')\n\n이 글을 그대로 복사해 감우에게 알려 주세요.');
    }
  }catch(e){
    show('bad','결과: 브라우저에서 직접은 막혀 있습니다\n('+(e&&e.name||'오류')+': '+String(e&&e.message||e).slice(0,160)+')\n이 경우 중계 기능이 필요합니다.\n\n이 글을 그대로 복사해 감우에게 알려 주세요.');
  }finally{$('go').disabled=false}
};
</script></body></html>
